name: Link check

# 每月 1 日自动检查全仓库 Markdown 里的链接是否有效。
# 失败时 GitHub 会通知仓库维护者，按 CONTRIBUTING.md 的"失效链接处理"流程修复。
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # 部分官网有反爬，失败不代表链接真的死了，人工复核为准
          args: >-
            --verbose --no-progress --exclude-mail
            --max-retries 2 --accept 200,204,206
            './**/*.md'
          fail: true
